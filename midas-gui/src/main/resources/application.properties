############################################################
# Quarkus configuration
############################################################
quarkus.application.name=Midas GUI
quarkus.http.port=8081
# Tests bind a random free port instead of Quarkus's fixed default 8081, which collides with
# midas-gui's dev port and with test runs in parallel sessions or other projects.
%test.quarkus.http.test-port=0
# Tests keep the session encryption key they create in the build directory.
%test.midas.session.key.path=target/test-session.key
# quarkus-jacoco only instruments the classes for @QuarkusTest coverage. The report comes from
# jacoco-maven-plugin (target/site/jacoco), as quarkus-jacoco's own report shows 0% (#41).
%test.quarkus.jacoco.report=false
quarkus.arc.detect-unused-false-positives=false
############################################################
# REST Client configuration
############################################################
# The API root, not /api/v1: the clients generated from midas-api/openapi.yaml carry the full path.
quarkus.rest-client.midas-api.url=http://localhost:8080
quarkus.rest-client.midas-api.connect-timeout=2000
quarkus.rest-client.midas-api.read-timeout=5000
quarkus.rest-client.disable-smart-produces=true
############################################################
# REST Client configuration for backend health endpoint
############################################################
quarkus.rest-client.midas-api-health.url=http://localhost:8080
quarkus.rest-client.midas-api-health.connect-timeout=2000
quarkus.rest-client.midas-api-health.read-timeout=3000
############################################################
# Logging configuration
############################################################
quarkus.log.level=INFO
%dev,test.quarkus.log.level=INFO
quarkus.log.category."de.vptr.midas".level=INFO
%dev,test.quarkus.log.category."de.vptr.midas".level=DEBUG
# Console logging
quarkus.log.console.format="%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
quarkus.log.console.json.enabled=true
%dev,test.quarkus.log.console.json.enabled=false
# File logging
quarkus.log.file.level=INFO
%dev,test.quarkus.log.file.level=INFO
quarkus.log.file.path=logs/midas-gui.log
quarkus.log.file.format="%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
quarkus.log.file.json.enabled=false
quarkus.log.file.enabled=true
%dev,test.quarkus.log.file.enabled=false
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
# Suppresses noisy CleanerJava9 INVOKE_CLEANER NPE logged by ChannelOutboundBuffer on JDK 25 (harmless, ByteBuf already freed)
quarkus.log.category."io.netty.channel.ChannelOutboundBuffer".level=ERROR
############################################################
# Security Headers
############################################################
# Vaadin Flow injects an inline bootstrap script and inline (Lumo) styles, so
# 'unsafe-inline' is required for script-src and style-src. Dev mode (Vite/HMR)
# additionally needs 'unsafe-eval' — added only in the %dev profile below to keep
# production tighter. connect-src allows ws:/wss: for Vaadin Push and dev HMR.
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self';
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."Permissions-Policy".value=geolocation=(),microphone=(),camera=()
############################################################
# Session and Cookie Security
############################################################
quarkus.http.same-site-cookie.session.value=Strict
