# The jobs call the same make targets a developer runs. Image publishing stays manual (make release).
# Actions are pinned by commit SHA; the comment names the tag it resolved from.
#
# Maven Central rate-limits the network's address (429), so every Maven download goes through the
# network's mirror of it: devkit's pinned Maven through DEVKIT_MAVEN_MIRROR, the resolver through
# the mirror each job writes into ~/.m2/settings.xml.
#
# The JDK, Vaadin's Node.js and ~/.m2/repository are downloaded on every run, not cached. The forge's
# cache is not scoped per branch, so any pull request can write the entry a later run restores, and
# a restore extracts it with tar -P, which writes wherever the archive's paths point, before a later
# step could check it. The NVD data is still cached, restored on every run but saved only by pushes
# to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DEVKIT_MAVEN_MIRROR: https://maven.vptr.de/central

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lint-secrets scans the full history; a shallow clone fails it
          persist-credentials: false # no later step pushes; keep the token away from build code
      # devkit's Markdown gate needs node on PATH; Vaadin's own Node.js under ~/.vaadin is not on it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # the newest 22.x, at or above devkit's 22.22.2 floor
          check-latest: true # not an older 22.x the runner has cached
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      # Replaces the settings.xml setup-java writes, whose only content is a server no step uses.
      - name: Use the Maven Central mirror
        run: |
          cat >~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror><id>central-mirror</id><mirrorOf>central</mirrorOf><url>${env.DEVKIT_MAVEN_MIRROR}</url></mirror>
            </mirrors>
          </settings>
          EOF
      # devkit.toml pins devkit's SSH URL, and the forge requires sign-in for every read, git over
      # HTTPS included. CI has no SSH identity, so the fetch goes over HTTPS with the read-only token
      # in DEVKIT_TOKEN, sent for this step only. A deploy token takes basic auth with any user name;
      # the forge rejects it as a token or bearer header. The trap removes the header from
      # ~/.gitconfig even when the fetch fails, so later steps never see it.
      - name: Fetch devkit
        env:
          DEVKIT_TOKEN: ${{ secrets.DEVKIT_TOKEN }}
        run: |
          git config --global url."https://git.vptr.de/".insteadOf "ssh://git@git.vptr.de:222/"
          trap 'git config --global --unset http.https://git.vptr.de/.extraHeader' EXIT
          git config --global http.https://git.vptr.de/.extraHeader \
            "Authorization: Basic $(printf 'ci:%s' "$DEVKIT_TOKEN" | base64 -w0)"
          ./devkitw path
      - run: make lint-repo
      - run: make install
      - run: make test

  audit:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      # The audit is a merge gate: a missing key fails the job before checkout, with an annotation.
      - name: Require NVD_API_KEY
        run: '[ -n "$NVD_API_KEY" ] || { echo "::error::NVD_API_KEY secret is not set; the dependency audit cannot run"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no later step pushes; keep the token away from build code
      # The NVD data, under ~/.m2/repository, is the only part of it cached: a download takes minutes.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Use the Maven Central mirror
        run: |
          cat >~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror><id>central-mirror</id><mirrorOf>central</mirrorOf><url>${env.DEVKIT_MAVEN_MIRROR}</url></mirror>
            </mirrors>
          </settings>
          EOF
      - name: Read today's date
        id: date
        run: echo "today=$(date -u +%F)" >>"$GITHUB_OUTPUT"
      - name: Restore NVD data
        id: nvd
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-nvd-${{ steps.date.outputs.today }}
          restore-keys: ${{ runner.os }}-nvd-
      # devkit.toml pins devkit's SSH URL, and the forge requires sign-in for every read, git over
      # HTTPS included. CI has no SSH identity, so the fetch goes over HTTPS with the read-only token
      # in DEVKIT_TOKEN, sent for this step only. A deploy token takes basic auth with any user name;
      # the forge rejects it as a token or bearer header. The trap removes the header from
      # ~/.gitconfig even when the fetch fails, so later steps never see it.
      - name: Fetch devkit
        env:
          DEVKIT_TOKEN: ${{ secrets.DEVKIT_TOKEN }}
        run: |
          git config --global url."https://git.vptr.de/".insteadOf "ssh://git@git.vptr.de:222/"
          trap 'git config --global --unset http.https://git.vptr.de/.extraHeader' EXIT
          git config --global http.https://git.vptr.de/.extraHeader \
            "Authorization: Basic $(printf 'ci:%s' "$DEVKIT_TOKEN" | base64 -w0)"
          ./devkitw path
      - run: make audit
      - name: Upload dependency-check reports
        if: ${{ !cancelled() && env.NVD_API_KEY != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            midas-*/target/dependency-check-report.html
      - name: Save NVD data
        if: github.event_name == 'push' && steps.nvd.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ steps.nvd.outputs.cache-primary-key }}
