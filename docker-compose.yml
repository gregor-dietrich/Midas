services:
  backend:
    image: gregordietrich/midas-api:${REVISION:-1.0.0-SNAPSHOT}
    pull_policy: build
    build:
      context: ./midas-api
      dockerfile: src/main/docker/Dockerfile.jvm-alpine
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-UTC}

      # Database
      quarkus.datasource.db-kind: postgresql
      quarkus.datasource.username: ${SQL_USERNAME:-midas}
      quarkus.datasource.password: ${SQL_PASSWORD:-changeit}
      quarkus.datasource.jdbc.url: jdbc:postgresql://db:${SQL_PORT:-5432}/${SQL_DATABASE:-midas}
      quarkus.datasource.jdbc.driver: org.postgresql.Driver

      # Initial admin, created on any start that finds the users table empty
      app.bootstrap.admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:-admin}
      app.bootstrap.admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}

      # Encryption key
      midas.encryption.key.path: /etc/midas/keys/encryption.key

      # General logging
      quarkus.log.level: INFO
      quarkus.log.category."de.vptr.midas".level: INFO

      # Console logging
      quarkus.log.console.enabled: true
      quarkus.log.console.json.enabled: false
      quarkus.log.console.format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      quarkus.log.console.level: INFO

      # File logging
      quarkus.log.file.enabled: false
      quarkus.log.file.json.enabled: false
      quarkus.log.file.format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      quarkus.log.file.level: INFO
      quarkus.log.file.path: logs/midas-api.log
      quarkus.log.file.rotation.max-file-size: 10M
      quarkus.log.file.rotation.max-backup-index: 3
    ports:
      - "8080:8080/tcp"
    volumes:
      - midas_keys:/etc/midas/keys
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: gregordietrich/midas-gui:${REVISION:-1.0.0-SNAPSHOT}
    pull_policy: build
    build:
      context: ./midas-gui
      dockerfile: src/main/docker/Dockerfile.jvm-alpine
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-UTC}

      # Backend URLs
      quarkus.rest-client.midas-api.url: http://backend:8080
      quarkus.rest-client.midas-api.connect-timeout: 3000
      quarkus.rest-client.midas-api.read-timeout: 5000

      quarkus.rest-client.midas-api-health.url: http://backend:8080
      quarkus.rest-client.midas-api-health.connect-timeout: 2000
      quarkus.rest-client.midas-api-health.read-timeout: 3000

      # Session key — persisted to a volume so sessions survive restarts and are
      # shareable across replicas (see SessionKeyManager).
      midas.session.key.path: /etc/midas/keys/session.key

      # General logging
      quarkus.log.level: INFO
      quarkus.log.category."de.vptr.midas".level: INFO

      # Console logging
      quarkus.log.console.enabled: true
      quarkus.log.console.json.enabled: false
      quarkus.log.console.format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      quarkus.log.console.level: INFO

      # File logging
      quarkus.log.file.enabled: false
      quarkus.log.file.json.enabled: false
      quarkus.log.file.format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      quarkus.log.file.level: INFO
      quarkus.log.file.path: logs/midas-gui.log
      quarkus.log.file.rotation.max-file-size: 10M
      quarkus.log.file.rotation.max-backup-index: 3
    ports:
      - "8081:8081/tcp"
    volumes:
      - midas_session_keys:/etc/midas/keys
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      TZ: ${TIMEZONE:-UTC}

      POSTGRES_USER: ${SQL_USERNAME:-midas}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-changeit}
      POSTGRES_DB: ${SQL_DATABASE:-midas}
      POSTGRES_PORT: ${SQL_PORT:-5432}
    ports:
      - "5432:${SQL_PORT:-5432}/tcp"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SQL_USERNAME:-midas} -d ${SQL_DATABASE:-midas}",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:9.17@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-UTC}

      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeit}
    ports:
      - "42069:80/tcp"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider -q http://localhost/login || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  midas_keys:
  midas_session_keys:
  postgres_data:
  pgadmin_data:
