services:
  backend:
    image: gregordietrich/midas-api:${REVISION:-1.0.0-SNAPSHOT}
    build:
      context: ./midas-api
      dockerfile: src/main/docker/Dockerfile.jvm-alpine
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-UTC}

      # Database
      quarkus.datasource.db-kind: postgresql
      quarkus.datasource.username: ${SQL_USERNAME:-midas}
      quarkus.datasource.password: ${SQL_PASSWORD:-changeit}
      quarkus.datasource.jdbc.url: jdbc:postgresql://db:${SQL_PORT:-5432}/${SQL_DATABASE:-midas}
      quarkus.datasource.jdbc.driver: org.postgresql.Driver

      # General logging
      quarkus.log.level: INFO
      quarkus.log.category."de.vptr.midas".level: INFO

      # Console logging
      quarkus.log.console.enabled: true
      quarkus.log.console.json.enabled: false
      quarkus.log.console.format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      quarkus.log.console.level: INFO

      # File logging
      quarkus.log.file.enabled: false
      quarkus.log.file.json.enabled: false
      quarkus.log.file.format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      quarkus.log.file.level: INFO
      quarkus.log.file.path: logs/midas-api.log
      quarkus.log.file.rotation.max-file-size: 10M
      quarkus.log.file.rotation.max-backup-index: 3
    ports:
      - "8080:8080/tcp"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: gregordietrich/midas-gui:${REVISION:-1.0.0-SNAPSHOT}
    build:
      context: ./midas-gui
      dockerfile: src/main/docker/Dockerfile.jvm-alpine
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-UTC}

      # Backend URLs
      quarkus.rest-client.midas-api.url: http://backend:8080/api/v1
      quarkus.rest-client.midas-api.connect-timeout: 3000
      quarkus.rest-client.midas-api.read-timeout: 5000

      quarkus.rest-client.midas-api-health.url: http://backend:8080
      quarkus.rest-client.midas-api-health.connect-timeout: 2000
      quarkus.rest-client.midas-api-health.read-timeout: 3000

      # General logging
      quarkus.log.level: INFO
      quarkus.log.category."de.vptr.midas".level: INFO

      # Console logging
      quarkus.log.console.enabled: true
      quarkus.log.console.json.enabled: false
      quarkus.log.console.format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      quarkus.log.console.level: INFO

      # File logging
      quarkus.log.file.enabled: false
      quarkus.log.file.json.enabled: false
      quarkus.log.file.format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      quarkus.log.file.level: INFO
      quarkus.log.file.path: logs/midas-gui.log
      quarkus.log.file.rotation.max-file-size: 10M
      quarkus.log.file.rotation.max-backup-index: 3
    ports:
      - "8081:8081/tcp"
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      TZ: ${TIMEZONE:-UTC}

      POSTGRES_USER: ${SQL_USERNAME:-midas}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-changeit}
      POSTGRES_DB: ${SQL_DATABASE:-midas}
      POSTGRES_PORT: ${SQL_PORT:-5432}
    ports:
      - "5432:${SQL_PORT:-5432}/tcp"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
      - ./midas-api/src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${SQL_USERNAME:-midas} -d ${SQL_DATABASE:-midas}"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:9.14.0
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-UTC}

      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeit}
    ports:
      - "42069:80/tcp"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider -q http://localhost/login || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
