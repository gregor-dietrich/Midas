############################################################
# Quarkus configuration
############################################################
quarkus.application.name=Midas API
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8081,${CORS_ALLOWED_ORIGINS:}
############################################################
# Database configuration
############################################################
%dev,test.quarkus.datasource.username=midas
%dev,test.quarkus.datasource.password=changeit
quarkus.datasource.db-version=18
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.driver=org.postgresql.Driver
%dev.quarkus.datasource.devservices.port=55432
%dev,test.quarkus.datasource.devservices.image-name=postgres:18.3-alpine3.23
%dev,test.quarkus.hibernate-orm.sql-load-script=sql/init.sql
############################################################
# Hibernate configuration
############################################################
quarkus.hibernate-orm.schema-management.strategy=validate
%dev,test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false
%dev.quarkus.hibernate-orm.log.bind-parameters=true
%test.quarkus.hibernate-orm.log.bind-parameters=false
############################################################
# Logging configuration
############################################################
quarkus.log.level=INFO
%dev,test.quarkus.log.level=INFO
quarkus.log.category."de.vptr.midas".level=INFO
%dev,test.quarkus.log.category."de.vptr.midas".level=DEBUG
# Console logging
quarkus.log.console.format="%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
quarkus.log.console.json.enabled=true
%dev,test.quarkus.log.console.json.enabled=false
# File logging
quarkus.log.file.level=INFO
%dev,test.quarkus.log.file.level=INFO
quarkus.log.file.path=logs/midas-api.log
quarkus.log.file.format="%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
quarkus.log.file.json.enabled=false
quarkus.log.file.enabled=true
%dev,test.quarkus.log.file.enabled=false
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
############################################################
# Rate limiting
############################################################
midas.rate-limit.read.permits=100
midas.rate-limit.write.permits=60
midas.rate-limit.auth.permits=10
midas.rate-limit.auth-failure.permits=10
midas.rate-limit.period-seconds=60
midas.rate-limit.bucket.max-entries=10000
%test.midas.rate-limit.read.permits=10000
%test.midas.rate-limit.write.permits=10000
%test.midas.rate-limit.auth.permits=1000
%test.midas.rate-limit.auth-failure.permits=1000
############################################################
# Proxy / forwarding
############################################################
# Only set to true when running behind a trusted reverse proxy (e.g., nginx, Traefik)
# that sets X-Forwarded-For. Setting this to true in a non-proxy environment allows
# IP spoofing attacks that can bypass rate limiting.
rate-limit.trust-forwarded-for=false
