---
openapi: 3.1.0
tags:
- name: Account
- name: Page
- name: Payment
- name: Post
- name: PostCategory
- name: PostComment
- name: User
- name: UserGroup
- name: UserRank
components:
  schemas:
    AccountAccessResponseDto:
      type: object
      properties:
        hasAccess:
          type: boolean
    AccountAssociationResponseDto:
      type: object
      properties:
        associated:
          type: boolean
    AccountDto:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          pattern: \S
          minLength: 1
          maxLength: 255
    AccountResponseDto:
      type: object
      properties:
        publicId:
          type: string
        name:
          type: string
        userCount:
          type: integer
          format: int64
        associatedUserPublicIds:
          type: array
          items:
            type: string
        balance:
          type: number
        isNegative:
          type: boolean
        canManage:
          type: boolean
        created:
          $ref: "#/components/schemas/LocalDateTime"
        lastEdit:
          $ref: "#/components/schemas/LocalDateTime"
    ApiErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
    BalancePointDto:
      type: object
      properties:
        date:
          $ref: "#/components/schemas/LocalDate"
        balance:
          type: number
    BalanceResponseDto:
      type: object
      properties:
        balance:
          type: number
    LocalDate:
      type: string
      format: date
      examples:
      - 2022-03-10
    LocalDateTime:
      type: string
      format: date-time
      examples:
      - 2022-03-10T12:15:50
    PageDto:
      type: object
      required:
      - title
      - content
      properties:
        title:
          type: string
          pattern: \S
          maxLength: 255
        content:
          type: string
          pattern: \S
          maxLength: 50000
    PageResponseDto:
      type: object
      properties:
        publicId:
          type: string
        title:
          type: string
        content:
          type: string
        created:
          $ref: "#/components/schemas/LocalDateTime"
        lastEdit:
          $ref: "#/components/schemas/LocalDateTime"
    PasswordChangeDto:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          pattern: \S
        newPassword:
          type: string
          pattern: "^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=!]).*$"
          minLength: 8
          maxLength: 72
    PaymentDto:
      type: object
      properties:
        targetAccountPublicId:
          type: string
        sourceAccountPublicId:
          type: string
        comment:
          type: string
          pattern: \S
          maxLength: 1000
        date:
          $ref: "#/components/schemas/LocalDate"
        amount:
          type: number
          exclusiveMinimum: 0.00
          multipleOf: 0.01
      required:
      - comment
      - date
      - amount
    PaymentResponseDto:
      type: object
      properties:
        publicId:
          type: string
        targetAccountPublicId:
          type: string
        targetAccountName:
          type: string
        sourceAccountPublicId:
          type: string
        sourceAccountName:
          type: string
        userPublicId:
          type: string
        username:
          type: string
        comment:
          type: string
        date:
          $ref: "#/components/schemas/LocalDate"
        amount:
          type: number
        created:
          $ref: "#/components/schemas/LocalDateTime"
        lastEdit:
          $ref: "#/components/schemas/LocalDateTime"
    PostCategoryDto:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          pattern: \S
          minLength: 1
          maxLength: 255
        parentPublicId:
          type: string
    PostCategoryResponseDto:
      type: object
      properties:
        publicId:
          type: string
        name:
          type: string
        parentPublicId:
          type: string
        parentName:
          type: string
        isRootCategory:
          type: boolean
        childrenCount:
          type: integer
          format: int32
        postsCount:
          type: integer
          format: int32
        childrenPublicIds:
          type: array
          items:
            type: string
        created:
          $ref: "#/components/schemas/LocalDateTime"
        lastEdit:
          $ref: "#/components/schemas/LocalDateTime"
    PostCommentDto:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          pattern: \S
          minLength: 1
          maxLength: 10000
        postPublicId:
          type: string
    PostCommentResponseDto:
      type: object
      properties:
        publicId:
          type: string
        content:
          type: string
        postPublicId:
          type: string
        postTitle:
          type: string
        userPublicId:
          type: string
        username:
          type: string
        created:
          $ref: "#/components/schemas/LocalDateTime"
        lastEdit:
          $ref: "#/components/schemas/LocalDateTime"
    PostDto:
      type: object
      required:
      - title
      - content
      properties:
        title:
          type: string
          pattern: \S
          minLength: 1
          maxLength: 255
        content:
          type: string
          pattern: \S
          minLength: 1
          maxLength: 50000
        categoryPublicId:
          type: string
        published:
          type: boolean
        commentable:
          type: boolean
    PostResponseDto:
      type: object
      properties:
        publicId:
          type: string
        title:
          type: string
        content:
          type: string
        userPublicId:
          type: string
        username:
          type: string
        categoryPublicId:
          type: string
        categoryName:
          type: string
        published:
          type: boolean
        commentable:
          type: boolean
        created:
          $ref: "#/components/schemas/LocalDateTime"
        lastEdit:
          $ref: "#/components/schemas/LocalDateTime"
        commentsCount:
          type: integer
          format: int64
    UserAccountMetaDto:
      type: object
      properties:
        isNegative:
          type: boolean
        canManage:
          type: boolean
    UserDto:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          pattern: \S
          minLength: 3
          maxLength: 50
        password:
          type: string
          pattern: "^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=!]).*$"
          minLength: 8
          maxLength: 72
        email:
          type: string
          maxLength: 255
        rankPublicId:
          type: string
        banned:
          type: boolean
        activated:
          type: boolean
        lastIp:
          type: string
          maxLength: 45
    UserGroupDto:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          pattern: \S
    UserGroupResponseDto:
      type: object
      properties:
        publicId:
          type: string
        name:
          type: string
        userCount:
          type: integer
          format: int64
        created:
          $ref: "#/components/schemas/LocalDateTime"
        lastEdit:
          $ref: "#/components/schemas/LocalDateTime"
    UserRankDto:
      type: object
      properties:
        adminView:
          type: boolean
        pageAdd:
          type: boolean
        pageDelete:
          type: boolean
        pageEdit:
          type: boolean
        postAdd:
          type: boolean
        postDelete:
          type: boolean
        postEdit:
          type: boolean
        postCategoryAdd:
          type: boolean
        postCategoryDelete:
          type: boolean
        postCategoryEdit:
          type: boolean
        postCommentAdd:
          type: boolean
        postCommentDelete:
          type: boolean
        postCommentEdit:
          type: boolean
        userAdd:
          type: boolean
        userDelete:
          type: boolean
        userEdit:
          type: boolean
        userGroupAdd:
          type: boolean
        userGroupDelete:
          type: boolean
        userGroupEdit:
          type: boolean
        userAccountAdd:
          type: boolean
        userAccountDelete:
          type: boolean
        userAccountEdit:
          type: boolean
        userRankAdd:
          type: boolean
        userRankDelete:
          type: boolean
        userRankEdit:
          type: boolean
        name:
          type: string
          pattern: \S
          minLength: 1
          maxLength: 100
      required:
      - name
    UserRankResponseDto:
      type: object
      properties:
        adminView:
          type: boolean
        pageAdd:
          type: boolean
        pageDelete:
          type: boolean
        pageEdit:
          type: boolean
        postAdd:
          type: boolean
        postDelete:
          type: boolean
        postEdit:
          type: boolean
        postCategoryAdd:
          type: boolean
        postCategoryDelete:
          type: boolean
        postCategoryEdit:
          type: boolean
        postCommentAdd:
          type: boolean
        postCommentDelete:
          type: boolean
        postCommentEdit:
          type: boolean
        userAdd:
          type: boolean
        userDelete:
          type: boolean
        userEdit:
          type: boolean
        userGroupAdd:
          type: boolean
        userGroupDelete:
          type: boolean
        userGroupEdit:
          type: boolean
        userAccountAdd:
          type: boolean
        userAccountDelete:
          type: boolean
        userAccountEdit:
          type: boolean
        userRankAdd:
          type: boolean
        userRankDelete:
          type: boolean
        userRankEdit:
          type: boolean
        publicId:
          type: string
        name:
          type: string
        usersCount:
          type: integer
          format: int64
        created:
          $ref: "#/components/schemas/LocalDateTime"
        lastEdit:
          $ref: "#/components/schemas/LocalDateTime"
    UserResponseDto:
      type: object
      properties:
        publicId:
          type: string
        username:
          type: string
        email:
          type: string
        rankPublicId:
          type: string
        rankName:
          type: string
        banned:
          type: boolean
        activated:
          type: boolean
        created:
          $ref: "#/components/schemas/LocalDateTime"
        lastLogin:
          $ref: "#/components/schemas/LocalDateTime"
        postsCount:
          type: integer
          format: int64
        commentsCount:
          type: integer
          format: int64
        isNegative:
          type: boolean
        canManage:
          type: boolean
  securitySchemes:
    basicAuth:
      description: Authentication
      type: http
      scheme: basic
paths:
  /api/v1/accounts:
    get:
      operationId: getAllAccounts
      tags:
      - Account
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponseDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get All Accounts
      security:
      - basicAuth:
        - user-account:edit
        - user-account:delete
    post:
      operationId: createAccount
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDto"
        required: true
      responses:
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponseDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      summary: Create Account
      security:
      - basicAuth:
        - user-account:add
  /api/v1/accounts/my:
    get:
      operationId: getMyAccounts
      tags:
      - Account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponseDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get My Accounts
      security:
      - basicAuth: []
  /api/v1/accounts/my/balance-history:
    get:
      operationId: getMyTotalBalanceHistory
      tags:
      - Account
      parameters:
      - name: endDate
        in: query
        schema:
          $ref: "#/components/schemas/LocalDate"
      - name: startDate
        in: query
        schema:
          $ref: "#/components/schemas/LocalDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalancePointDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get My Total Balance History
      security:
      - basicAuth: []
  /api/v1/accounts/my/payments:
    get:
      operationId: getMyAccountsPayments
      tags:
      - Account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/PaymentResponseDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get My Accounts Payments
      security:
      - basicAuth: []
  /api/v1/accounts/my/with-balances:
    get:
      operationId: getMyAccountsWithBalances
      tags:
      - Account
      parameters:
      - name: endDate
        in: query
        schema:
          $ref: "#/components/schemas/LocalDate"
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
      - name: startDate
        in: query
        schema:
          $ref: "#/components/schemas/LocalDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponseDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get My Accounts With Balances
      security:
      - basicAuth: []
  /api/v1/accounts/my/{accountPublicId}/payments:
    post:
      operationId: createMyAccountPayment
      tags:
      - Account
      parameters:
      - name: accountPublicId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentDto"
        required: true
      responses:
        "403":
          description: Caller has no access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponseDto"
        "401":
          description: Not Authorized
        "400":
          description: Bad Request
      summary: Create My Account Payment
      security:
      - basicAuth: []
  /api/v1/accounts/my/{accountPublicId}/payments/{paymentPublicId}:
    put:
      operationId: updateMyAccountPayment
      tags:
      - Account
      parameters:
      - name: accountPublicId
        in: path
        required: true
        schema:
          type: string
      - name: paymentPublicId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentDto"
        required: true
      responses:
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller has no access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Payment replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponseDto"
        "401":
          description: Not Authorized
        "400":
          description: Bad Request
      summary: Update My Account Payment
      security:
      - basicAuth: []
    delete:
      operationId: deleteMyAccountPayment
      tags:
      - Account
      parameters:
      - name: accountPublicId
        in: path
        required: true
        schema:
          type: string
      - name: paymentPublicId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Payment deleted
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller has no access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not Authorized
      summary: Delete My Account Payment
      security:
      - basicAuth: []
  /api/v1/accounts/my/{publicId}/balance:
    get:
      operationId: getMyAccountBalance
      tags:
      - Account
      parameters:
      - name: publicId
        in: path
        required: true
        schema:
          type: string
      - name: endDate
        in: query
        schema:
          $ref: "#/components/schemas/LocalDate"
      - name: startDate
        in: query
        schema:
          $ref: "#/components/schemas/LocalDate"
      responses:
        "403":
          description: Caller has no access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Account balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponseDto"
        "401":
          description: Not Authorized
      summary: Get My Account Balance
      security:
      - basicAuth: []
  /api/v1/accounts/my/{publicId}/balance-history:
    get:
      operationId: getMyAccountBalanceHistory
      tags:
      - Account
      parameters:
      - name: publicId
        in: path
        required: true
        schema:
          type: string
      - name: endDate
        in: query
        schema:
          $ref: "#/components/schemas/LocalDate"
      - name: startDate
        in: query
        schema:
          $ref: "#/components/schemas/LocalDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalancePointDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get My Account Balance History
      security:
      - basicAuth: []
  /api/v1/accounts/my/{publicId}/check:
    get:
      operationId: checkMyAccountAccess
      tags:
      - Account
      parameters:
      - name: publicId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAccessResponseDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Check My Account Access
      security:
      - basicAuth: []
  /api/v1/accounts/my/{publicId}/payments:
    get:
      operationId: getMyAccountPayments
      tags:
      - Account
      parameters:
      - name: publicId
        in: path
        required: true
        schema:
          type: string
      - name: endDate
        in: query
        schema:
          $ref: "#/components/schemas/LocalDate"
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: query
        in: query
        schema:
          type: string
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
      - name: startDate
        in: query
        schema:
          $ref: "#/components/schemas/LocalDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentResponseDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get My Account Payments
      security:
      - basicAuth: []
  /api/v1/accounts/my/{publicId}/payments/incoming:
    get:
      operationId: getMyAccountIncomingPayments
      tags:
      - Account
      parameters:
      - name: publicId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentResponseDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get My Account Incoming Payments
      security:
      - basicAuth: []
  /api/v1/accounts/my/{publicId}/payments/outgoing:
    get:
      operationId: getMyAccountOutgoingPayments
      tags:
      - Account
      parameters:
      - name: publicId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentResponseDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get My Account Outgoing Payments
      security:
      - basicAuth: []
  /api/v1/accounts/name/{name}:
    get:
      operationId: getAccountByName
      tags:
      - Account
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponseDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get Account By Name
      security:
      - basicAuth:
        - user-account:edit
        - user-account:delete
  /api/v1/accounts/search:
    get:
      operationId: searchAccounts
      tags:
      - Account
      parameters:
      - name: query
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Matching accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponseDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Search Accounts
      security:
      - basicAuth:
        - user-account:edit
        - user-account:delete
  /api/v1/accounts/user/{userPublicId}:
    get:
      operationId: getAccountsByUser
      tags:
      - Account
      parameters:
      - name: userPublicId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponseDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get Accounts By User
      security:
      - basicAuth:
        - user-account:edit
        - user-account:delete
  /api/v1/accounts/user/{userPublicId}/account/{accountPublicId}/check:
    get:
      operationId: checkUserAccountAssociation
      tags:
      - Account
      parameters:
      - name: accountPublicId
        in: path
        required: true
        schema:
          type: string
      - name: userPublicId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Association status
          content:
            application/json:
              schema:
