[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "midas-test"
version = "1.0.0"
description = "Integration test and monitoring UI for the Midas API"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.33",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3",
    "streamlit>=1.55",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.5",
    "pyright>=1.1",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["config", "app", "common"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
